name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: fcz
            asset: fcz-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: fcz
            asset: fcz-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            binary: fcz
            asset: fcz-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fcz.exe
            asset: fcz-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check
      - name: Check
        run: cargo check --target ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Lint
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum fcz-* > SHA256SUMS
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
