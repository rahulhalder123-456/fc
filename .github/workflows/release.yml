name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.asset_name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fcz
            asset_name: fcz-linux-x86_64

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: fcz
            asset_name: fcz-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fcz
            asset_name: fcz-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fcz.exe
            asset_name: fcz-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv "${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          generate_release_notes: true
